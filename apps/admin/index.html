<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sizzling Skewers · 商家后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #a04100;
      --primary-container: #ff6b00;
      --on-primary: #ffffff;
      --on-primary-container: #572000;
      --bg: #fcf9f8;
      --surface: #ffffff;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #f6f3f2;
      --surface-container: #f0eded;
      --surface-container-high: #eae7e7;
      --on-surface: #1c1b1b;
      --on-surface-variant: #5a4136;
      --secondary: #5e5e5c;
      --secondary-container: #e1dfdc;
      --tertiary: #006e1c;
      --tertiary-container: #4aad4e;
      --error: #ba1a1a;
      --error-container: #ffdad6;
      --outline: #8e7164;
      --outline-variant: #e2bfb0;
      --text: #1c1b1b;
      --text-secondary: #5e5e5c;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    body { margin: 0; font-family: var(--font-body); font-size: 14px; background: var(--bg); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
